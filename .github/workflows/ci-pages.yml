name: Validate and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish preview/homepage under /preview/homepage/ while preserving the main site
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/preview/homepage' && inputs.publish_preview && 'refs/heads/main' || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      production_sha: ${{ steps.preview.outputs.production_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
          enable-cache: false
      - run: npm ci
      - name: Restore icon download cache
        uses: actions/cache@v5
        with:
          path: .sync-stage/cache
          key: icon-downloads-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            icon-downloads-v1-${{ runner.os }}-
      - run: npm run build:cloudflare
      - run: npm run test:offline
      - run: npm run check:cloudflare
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: worker-index
          path: .worker-build/search-index.json
          include-hidden-files: true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: static-site
          path: dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: alibaba-compatible-site
          path: dist-alibaba
      - name: Preserve production and add the homepage preview
        id: preview
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/preview/homepage' && inputs.publish_preview
        run: node scripts/prepare-preview.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5.0.0
        if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/preview/homepage' && inputs.publish_preview)
        with:
          path: ${{ steps.preview.outputs.path || (vars.LEGACY_REDIRECTS == 'true' && 'dist-pages' || 'dist') }}
          include-hidden-files: true
  cloudflare:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: static-site
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: worker-index
          path: .worker-build
      - name: Deploy Cloudflare website and API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_DOMAIN: ${{ vars.CLOUDFLARE_PRODUCTION }}
        run: |
          if [ "$PRODUCTION_DOMAIN" = true ]; then
            npm run deploy:cloudflare:production
          else
            npm run deploy:cloudflare
          fi
  deploy:
    if: always() && needs.build.result == 'success' && (needs.cloudflare.result == 'success' || needs.cloudflare.result == 'skipped') && ((github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/preview/homepage' && inputs.publish_preview))
    needs: [build, cloudflare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check main has not changed during preview preparation
        if: needs.build.outputs.production_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.build.outputs.production_sha }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Link to the preview
        if: needs.build.outputs.production_sha != ''
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "Homepage preview (main unchanged) — ${PAGE_URL%/}/preview/homepage/" >> "$GITHUB_STEP_SUMMARY"
